# Alembic configuration.
#
# The database URL is intentionally left blank. The migration environment
# in ``migrations/env.py`` reads the URL from the application's runtime
# configuration (``AppDirectories.database_file``) so that the URL matches
# the application's actual database at all times. Setting ``sqlalchemy.url``
# here would create a second source of truth that could drift.
#
# Script paths, versioning layout, and logging behavior are configured
# below. The logging sections mirror the application's logging format so
# that migration output is readable alongside application output.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S